<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Чеклист комбинаций</title>
<style>
/* Layout: one narrow column of 14 tappable rows, 4 colour cells each, sticky progress bar on top. */
:root {
  --bg: #e9e9ec;
  --fg: #17181c;
  --muted: #5d6068;
  --gap: #8c8e94;
  --panel: #f6f6f8;
  --line: #17181c;
  --focus: #1a4fd6;
  --c-r: #ff2a00;
  --c-g: #00c800;
  --c-b: #0a1ef0;
  --c-y: #ffe600;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141517; --fg: #ececf0; --muted: #9a9ca4; --gap: #6f7178;
    --panel: #1d1e21; --line: #ffffff; --focus: #7fa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141517; --fg: #ececf0; --muted: #9a9ca4; --gap: #6f7178;
  --panel: #1d1e21; --line: #ffffff; --focus: #7fa2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  padding-inline: 16px;
  padding-block: 0 32px;
  min-height: 100%;
}
.wrap { max-width: 440px; margin-inline: auto; }
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 2;
  background: var(--bg);
  padding-block: 14px 12px;
  display: grid;
  gap: 10px;
}
.head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 1.05rem; font-weight: 800; letter-spacing: 0.01em; }
.count { font-family: var(--font-num); font-size: 0.95rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.count b { color: var(--fg); font-weight: 700; }
.bar { height: 6px; background: var(--gap); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--fg); transition: width .25s ease; }

ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.row {
  position: relative;
  display: grid;
  grid-template-columns: 26px 1fr;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-align: left;
  -webkit-tap-highlight-color: transparent;
}
.row:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
.n {
  font-family: var(--font-num);
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  text-align: right;
}
.cells {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 3px;
  background: var(--gap);
  transition: opacity .18s ease, filter .18s ease;
}
.cell { height: 44px; }
.R { background: var(--c-r); }
.G { background: var(--c-g); }
.B { background: var(--c-b); }
.Y { background: var(--c-y); }
.cells::after {
  content: "";
  position: absolute;
  left: 6px; right: 6px; top: 50%;
  height: 4px;
  margin-top: -2px;
  background: var(--line);
  border-radius: 2px;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .18s ease;
}
.row[aria-pressed="true"] .cells { opacity: .28; filter: saturate(.55) brightness(.7); }
.row[aria-pressed="true"] .cells::after { transform: scaleX(1); }
.row[aria-pressed="true"] .n { text-decoration: line-through; }
@media (hover: hover) {
  .row:hover .cells { outline: 2px solid var(--fg); outline-offset: 0; }
}

footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px; }
.hint { color: var(--muted); font-size: 0.8rem; margin: 0; }
.reset {
  font: inherit; font-size: 0.85rem; font-weight: 700;
  padding: 9px 14px;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--gap);
  border-radius: 6px;
  cursor: pointer;
}
.reset:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.reset.arm { background: var(--fg); color: var(--bg); border-color: var(--fg); }
@media (prefers-reduced-motion: reduce) {
  .cells, .cells::after, .bar > i { transition: none; }
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@700;800&display=swap">

<div class="wrap">
  <header>
    <div class="head-row">
      <h1>Чеклист комбинаций</h1>
      <div class="count" id="count" aria-live="polite"></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  </header>
  <ul id="list"></ul>
  <footer>
    <p class="hint">Нажми на ряд, чтобы отметить. Ещё раз, чтобы снять.</p>
    <button class="reset" id="reset" type="button">Сбросить</button>
  </footer>
</div>

<script>
(function () {
  var ROWS = ["RGBB","RBBY","RGBY","RRBB","GBBY","RRGB","RRBY","RRGY","RRRG","RRRB","RRRY","RBBB","GBBB","BBBY"];
  var NAMES = { R: "красный", G: "зелёный", B: "синий", Y: "жёлтый" };
  var KEY = "combo-checklist-v1";
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} }

  var list = document.getElementById("list");
  var countEl = document.getElementById("count");
  var fill = document.getElementById("fill");
  var buttons = [];

  ROWS.forEach(function (row, i) {
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button";
    b.className = "row";
    var names = row.split("").map(function (c) { return NAMES[c]; }).join(", ");
    b.setAttribute("aria-label", "Ряд " + (i + 1) + ": " + names);
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span class="cells">' +
      row.split("").map(function (c) { return '<span class="cell ' + c + '"></span>'; }).join("") + '</span>';
    b.addEventListener("click", function () {
      if (done[i]) delete done[i]; else done[i] = 1;
      save(); render();
    });
    li.appendChild(b);
    list.appendChild(li);
    buttons.push(b);
  });

  function render() {
    var n = 0;
    buttons.forEach(function (b, i) {
      var on = !!done[i];
      if (on) n++;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    countEl.innerHTML = "<b>" + n + "</b> / " + ROWS.length;
    fill.style.width = (n / ROWS.length * 100) + "%";
  }

  var reset = document.getElementById("reset");
  var timer = null;
  reset.addEventListener("click", function () {
    if (!reset.classList.contains("arm")) {
      reset.classList.add("arm");
      reset.textContent = "Точно сбросить?";
      timer = setTimeout(disarm, 3000);
      return;
    }
    clearTimeout(timer);
    done = {};
    save(); render(); disarm();
  });
  function disarm() { reset.classList.remove("arm"); reset.textContent = "Сбросить"; }

  render();
})();
</script>

</body></html>
